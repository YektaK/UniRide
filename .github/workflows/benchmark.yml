name: Benchmark Regression Gate

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/skills/**'
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/skills/**'

jobs:
  regression-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy numba pytest
          pip install -e .

      - name: SOTA solver smoke tests
        run: python -m pytest uniride_core/tests/sota_tsp/ -v

      - name: ATSP integration tests
        run: python -m pytest academic_benchmark/tests/test_atsp_integration.py -v

      - name: Regression gate (5 problems x 6 solvers)
        run: python -m pytest academic_benchmark/tests/test_regression_gate.py -v

      - name: SOTA E2E tests
        run: python -m pytest academic_benchmark/tests/test_sota_e2e.py -v
