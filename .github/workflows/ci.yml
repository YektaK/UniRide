name: WIP integration

on:
  push:
    branches: [WIP]
  pull_request:
    branches: [WIP]
  workflow_dispatch:
  schedule:
    # Nightly full Python suite (03:00 UTC). Scheduled runs use the default branch.
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  frontend:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Frontend tests
        run: npm test -- --run
      - name: Production build
        # Placeholder public values only; no real secrets. They are inlined at
        # build time and the build does not contact Supabase.
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  python:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" -c academic_benchmark/jit-benchmark-constraints.txt
          python -m pip install -r optimizer_api/requirements.txt -c academic_benchmark/jit-benchmark-constraints.txt
      - name: Verify dependency graph
        run: python -m pip check
      - name: Collect integration suites
        run: >-
          python -m pytest --collect-only academic_benchmark/tests
          uniride_core/tests optimizer_api/tests -q -p no:cacheprovider
      - name: Run focused Python integration tests
        run: >-
          python -m pytest
          academic_benchmark/tests/test_manifest_contracts.py
          academic_benchmark/tests/test_algorithm_capability_catalog.py
          academic_benchmark/tests/test_atsp_integration.py
          academic_benchmark/tests/test_fair_comparison_protocol.py
          academic_benchmark/tests/test_fair_comparison_scientific_integrity.py
          uniride_core/tests/test_matrix_benchmark_runner.py
          optimizer_api/tests/test_phase0_containment.py
          optimizer_api/tests/test_benchmark_router_problem_loading.py
          -q -p no:cacheprovider --tb=short

  python-full:
    # Full canonical suites: nightly and on demand only, so per-push CI stays fast.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" -c academic_benchmark/jit-benchmark-constraints.txt
          python -m pip install -r optimizer_api/requirements.txt -c academic_benchmark/jit-benchmark-constraints.txt
          # Academic-only analysis extra (D-04a); the nightly suite includes test_analysis_environment.py, which checks the pins.
          python -m pip install -r requirements-analysis.txt -c academic_benchmark/jit-benchmark-constraints.txt
      - name: Verify dependency graph
        run: python -m pip check
      - name: Run full canonical Python suites
        env:
          # The extra is installed above: a missing SciPy/statsmodels must fail the analysis tests, never skip them.
          UNIRIDE_REQUIRE_ANALYSIS_EXTRA: "1"
          PYTHON_DOTENV_DISABLED: "1"
          SUPABASE_URL: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
          PYTHONPATH: optimizer_api
        run: >-
          python -B -m pytest
          uniride_core/tests optimizer_api/tests academic_benchmark/tests
          -q -p no:cacheprovider --tb=short
