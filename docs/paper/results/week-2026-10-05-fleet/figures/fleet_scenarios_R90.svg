<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 450" width="660" height="450" font-family="Arial, Helvetica, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/>
<defs><pattern id="hatchgrey" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#999" stroke-width="2"/></pattern><pattern id="hatchbad" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#E69F00"/><line x1="0" y1="0" x2="0" y2="6" stroke="#C00000" stroke-width="3"/></pattern></defs>
<text x="24" y="24" font-size="16" font-weight="bold" fill="#111">Weekly vehicles by scenario, R=90 min</text>
<text x="24" y="42" font-size="12" fill="#444">Large + sedans; per-day need under each bar (x = infeasible day).</text>
<rect x="24" y="54" width="14" height="10" fill="#0072B2"/><text x="44" y="64" font-size="12" fill="#222">Large minibuses (fixed fleet)</text>
<rect x="234" y="54" width="14" height="10" fill="#E69F00"/><text x="254" y="64" font-size="12" fill="#222">Sedans (largest daily need)</text>
<rect x="24" y="72" width="14" height="10" fill="url(#hatchgrey)" stroke="#777"/><text x="44" y="82" font-size="12" fill="#222">Infeasible on at least one weekday</text>
<rect x="274" y="72" width="14" height="10" fill="url(#hatchbad)" stroke="#C00000"/><text x="294" y="82" font-size="12" fill="#222">Sedan count not proven over menu</text>
<text x="60" y="108" font-size="14" font-weight="bold" fill="#111">R = 90 min, week of 2026-10-05</text>
<rect x="60" y="120" width="560" height="280" fill="#fff" stroke="#888" stroke-width="0.8"/>
<line x1="60" y1="400" x2="620" y2="400" stroke="#e2e2e2" stroke-width="0.7"/>
<text x="55" y="404" font-size="11" text-anchor="end" fill="#333">0</text>
<line x1="60" y1="365" x2="620" y2="365" stroke="#e2e2e2" stroke-width="0.7"/>
<text x="55" y="369" font-size="11" text-anchor="end" fill="#333">1</text>
<line x1="60" y1="330" x2="620" y2="330" stroke="#e2e2e2" stroke-width="0.7"/>
<text x="55" y="334" font-size="11" text-anchor="end" fill="#333">2</text>
<line x1="60" y1="295" x2="620" y2="295" stroke="#e2e2e2" stroke-width="0.7"/>
<text x="55" y="299" font-size="11" text-anchor="end" fill="#333">3</text>
<line x1="60" y1="260" x2="620" y2="260" stroke="#e2e2e2" stroke-width="0.7"/>
<text x="55" y="264" font-size="11" text-anchor="end" fill="#333">4</text>
<line x1="60" y1="225" x2="620" y2="225" stroke="#e2e2e2" stroke-width="0.7"/>
<text x="55" y="229" font-size="11" text-anchor="end" fill="#333">5</text>
<line x1="60" y1="190" x2="620" y2="190" stroke="#e2e2e2" stroke-width="0.7"/>
<text x="55" y="194" font-size="11" text-anchor="end" fill="#333">6</text>
<line x1="60" y1="155" x2="620" y2="155" stroke="#e2e2e2" stroke-width="0.7"/>
<text x="55" y="159" font-size="11" text-anchor="end" fill="#333">7</text>
<line x1="60" y1="120" x2="620" y2="120" stroke="#e2e2e2" stroke-width="0.7"/>
<text x="55" y="124" font-size="11" text-anchor="end" fill="#333">8</text>
<text x="130" y="415" font-size="12" text-anchor="middle" fill="#111">A</text>
<text x="130" y="428" font-size="10" text-anchor="middle" fill="#444">large 4/3/4/4/4</text>
<rect x="101" y="260" width="58" height="140" fill="#0072B2"><title>A: all-large minimum R=90: 4 large</title></rect>
<text x="130" y="255" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">4</text>
<text x="130" y="334" font-size="11" text-anchor="middle" fill="#fff">4</text>
<text x="270" y="415" font-size="12" text-anchor="middle" fill="#111">B (1)</text>
<text x="270" y="428" font-size="10" text-anchor="middle" fill="#444">sedans x/x/x/x/x</text>
<rect x="241" y="124" width="58" height="276" fill="url(#hatchgrey)" fill-opacity="0.45" stroke="#777" stroke-dasharray="5 3"><title>B: 1 large + sedans R=90: infeasible on 5 of 5 days with 1 large vehicle(s)</title></rect>
<text transform="rotate(-90 270 260)" x="274" y="260" font-size="13" font-weight="bold" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">infeasible (5 of 5 days)</text>
<text x="410" y="415" font-size="12" text-anchor="middle" fill="#111">C (2)</text>
<text x="410" y="428" font-size="10" text-anchor="middle" fill="#444">sedans 2/x/x/2/2</text>
<rect x="381" y="124" width="58" height="276" fill="url(#hatchgrey)" fill-opacity="0.45" stroke="#777" stroke-dasharray="5 3"><title>C: 2 large + sedans R=90: infeasible on 2 of 5 days with 2 large vehicle(s)</title></rect>
<text transform="rotate(-90 410 260)" x="414" y="260" font-size="13" font-weight="bold" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke">infeasible (2 of 5 days)</text>
<text x="550" y="415" font-size="12" text-anchor="middle" fill="#111">D (3)</text>
<text x="550" y="428" font-size="10" text-anchor="middle" fill="#444">sedans 1/0/1/1/0</text>
<rect x="521" y="295" width="58" height="105" fill="#0072B2"><title>D: 3 large + sedans R=90: 3 large</title></rect>
<rect x="521" y="260" width="58" height="35" fill="#E69F00" stroke="#fff"><title>D: 3 large + sedans R=90: 1 sedans (max over days)</title></rect>
<text x="550" y="255" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">4</text>
<text x="550" y="351.5" font-size="11" text-anchor="middle" fill="#fff">3</text>
<text x="550" y="281.5" font-size="11" text-anchor="middle" fill="#111">1</text>
</svg>
