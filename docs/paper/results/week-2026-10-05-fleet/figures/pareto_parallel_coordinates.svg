<text x="412" y="80" font-size="12" fill="#222">V: minibuses + minivans (3 seats, max 1 Sw)</text>
<polygon points="726,68.5 733.5,76 726,83.5 718.5,76" fill="#009E73" fill-opacity="1" stroke="#fff" stroke-width="1"></polygon>
<text x="737" y="80" font-size="12" fill="#222">H: day-level hybrid</text>
