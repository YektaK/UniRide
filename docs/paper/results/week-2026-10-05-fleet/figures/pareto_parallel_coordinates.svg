<polygon points="635,68.5 642.5,76 635,83.5 627.5,76" fill="#009E73" fill-opacity="1" stroke="#fff" stroke-width="1"></polygon>
<text x="646" y="80" font-size="12" fill="#222">H: day-level hybrid</text>
