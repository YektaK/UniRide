<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 570" width="1070" height="570" font-family="Arial, Helvetica, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="24" font-size="16" font-weight="bold" fill="#111">Parallel coordinates of the objectives f1..f5, all feasible options</text>
<text x="24" y="42" font-size="12" fill="#444">Every axis is minimised: bottom = better. One line per option (hover for details). Solid = non-dominated on (f1, f2, f3) for its R; dashed = dominated. Colour and marker = family.</text>
<text x="24" y="58" font-size="12" fill="#444">f5 = service level, shown as the ride limit R and the realised weekly mean ride.</text>
<circle cx="31" cy="76" r="6" fill="#0072B2" fill-opacity="1" stroke="#fff" stroke-width="1"></circle>
<text x="42" y="80" font-size="12" fill="#222">A: minibuses only</text>
