<text x="24" y="24" font-size="16" font-weight="bold" fill="#111">Service level vs owned minibuses (colour = borrowed vehicle-hours per week)</text>
<text x="24" y="42" font-size="12" fill="#444">x = realised mean ride (passenger-weighted, week). The four clusters are R = 50, 60, 70, 90; a small vertical offset separates families at the same L.</text>
<text x="24" y="58" font-size="12" fill="#444">Shape = family; black outline = non-dominated for its R, grey outline = dominated.</text>
