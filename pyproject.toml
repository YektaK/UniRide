[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "uniride"
version = "3.1.0"
description = "CVRPTW Optimization Framework and Academic Benchmark Suite"
dependencies = [
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "numpy>=1.24.0",
    "numba>=0.58.0"
]

[project.optional-dependencies]
solvers = [
    "ortools",
    "pyvrp",
    "pyvroom",
    "vrplib"
]
test = [
    "pytest",
    "hypothesis"
]

[tool.setuptools.packages.find]
include = ["uniride_core*", "optimizer_api*", "academic_benchmark*"]

[tool.setuptools.package-data]
"academic_benchmark.schemas" = ["*.schema.json"]
"uniride_core.exact" = ["models/*.mod"]
"academic_benchmark.studies" = ["*/study.json", "*/analysis_plan.json"]
"academic_benchmark.datasets" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["uniride_core/tests", "optimizer_api/tests", "academic_benchmark/tests"]
markers = [
    "requires_ampl: needs a local AMPL installation, solver and license (skipped with a reason when absent; design EXACT_SOLVER_AMPL_DESIGN.md section 7)",
    "requires_highspy: needs the optional highspy package (skipped with a reason when absent; design JOINT_DAY_MODEL_DESIGN.md 4.1, WP-E11 J4)",
    "requires_analysis_extra: needs the academic analysis extra (SciPy, statsmodels; requirements-analysis.txt; skipped with a reason when absent; fails instead when UNIRIDE_REQUIRE_ANALYSIS_EXTRA=1, as in the nightly job)",
    "requires_gurobi: needs amplpy, a local AMPL installation, the Gurobi AMPL solver and its licence (skipped with a reason when absent; design JOINT_DAY_MODEL_DESIGN.md 4.1, WP-E11 J5)",
]
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "archive",
]
