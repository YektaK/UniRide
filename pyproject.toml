[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "uniride"
version = "3.1.0"
description = "CVRPTW Optimization Framework and Academic Benchmark Suite"
dependencies = [
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "numpy",
    "numba"
]

[project.optional-dependencies]
solvers = [
    "ortools",
    "pyvrp",
    "pyvroom",
    "vrplib"
]
test = [
    "pytest",
    "hypothesis"
]

[tool.setuptools.packages.find]
include = ["uniride_core*", "optimizer_api*", "academic_benchmark*"]
